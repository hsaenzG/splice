name: Issue reviewer

# Fires when someone opens a new issue. The agent reads it, searches, and
# leaves a comment with suggested labels. It runs on its own, no laptop needed.
on:
  issues:
    types: [opened]

permissions:
  issues: write        # to post the comment
  contents: read       # the agent reads repo code, nothing more

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the agent
        run: pip install -r examples/issue-reviewer/requirements.txt

      - name: Review the issue
        id: review
        env:
          # The agent runs on model="openai/...", so the harness reads the key
          # from OPENAI_API_KEY. Store it as a repo secret (Settings > Secrets
          # and variables > Actions). The native web_search tool bills through
          # this key. To run on Bedrock instead, switch the model in agent.py
          # and swap this for AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python examples/issue-reviewer/agent.py > comment.md
          cat comment.md

      - name: Post the comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
