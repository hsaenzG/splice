[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splice-cli"
version = "0.1.2"
description = "Shared context layer for Kiro, Cursor, and Claude Code — one trigger, any IDE, privacy-first."
readme = {file = "README.md", content-type = "text/markdown"}
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai", "ide", "kiro", "cursor", "claude", "context", "orchestration", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
splice = "splice_cli.cli:main"

[project.urls]
Homepage = "https://github.com/hsaenzG/splice"
Repository = "https://github.com/hsaenzG/splice"
Issues = "https://github.com/hsaenzG/splice/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["splice_cli*"]

[tool.setuptools.package-data]
"splice_cli" = [
    "data/hooks/*.sh",
    "data/templates/*.json",
    "data/templates/*.md",
    "data/templates/*.mdc",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
